document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

sses\" style=\"padding:12px 4px;border-top:1px solid oklch(0.9 0.005 260);\">Businesses<\u002Fa>\n      <a href=\"#ventures\" style=\"padding:12px 4px;border-top:1px solid oklch(0.9 0.005 260);\">Ventures<\u002Fa>\n      <a href=\"#partnerships\" style=\"padding:12px 4px;border-top:1px solid oklch(0.9 0.005 260);\">Partnerships<\u002Fa>\n      <a href=\"#contact\" style=\"padding:12px 4px;border-top:1px solid oklch(0.9 0.005 260);\">Contact<\u002Fa>\n   <\u002Fnav>\n  <\u002Fheader>\n\n  <section style=\"padding:80px 56px 0;max-width:1400px;margin:0 auto;text-align:center;\">\n    <h1 style=\"font-size:clamp(40px,5.2vw,76px);line-height:1.02;letter-spacing:-0.02em;font-weight:800;margin:0 0 28px;color:oklch(0.18 0.01 260);text-wrap:balance;\">Building What's Next.<\u002Fh1>\n    <p style=\"font-size:18px;line-height:1.7;color:oklch(0.4 0.01 260);max-width:640px;margin:0 auto 36px;\">We develop businesses, products, and opportunities across media, technology, property, and trading — connecting ideas, technology, capital, and execution into businesses built for lasting value.<\u002Fp>\n    <div style=\"display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-bottom:56px;\">\n      <a href=\"#businesses\" style=\"background:#0B3D91;color:white;padding:16px 30px;border-radius:2px;font-weight:700;font-size:14.5px;border-bottom:2px solid #C9A227;transition:transform 0.2s, background 0.2s;\" style-hover=\"background:#082c6b;transform:translateY(-2px);\">Discover Our Businesses<\u002Fa>\n      <a href=\"#ventures\" style=\"border:1.5px solid oklch(0.8 0.01 260);color:oklch(0.3 0.01 260);padding:16px 30px;border-radius:2px;font-weight:700;font-size:14.5px;transition:border-color 0.2s, transform 0.2s;\" style-hover=\"border-color:#C9A227;transform:translateY(-2px);\">Explore Our Ventures<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"width:100%;aspect-ratio:16/6;\">\n    <image-slot id=\"hero-photo\" shape=\"rect\" fit=\"contain\" placeholder=\"Drop a hero banner photo\" src=\"73baa6e8-6012-4a3c-abc3-f1256e7fa303\"><\u002Fimage-slot>\n  <\u002Fsection>\n\n  <section style=\"background:white;padding:96px 56px;border-top:1px solid oklch(0.9 0.005 260);\">\n    <div style=\"max-width:1400px;margin:0 auto;\">\n      <div style=\"font-size:13px;font-weight:700;letter-spacing:0.14em;color:#0B3D91;margin-bottom:16px;\">FOUR SECTORS. ONE VISION.<\u002Fdiv>\n      <h2 style=\"font-size:clamp(30px,3.2vw,42px);letter-spacing:-0.01em;font-weight:800;margin:0 0 20px;color:oklch(0.18 0.01 260);max-width:680px;text-wrap:balance;\">We operate across industries where we see the potential to create meaningful businesses and lasting impact.<\u002Fh2>\n\n      <div style=\"display:flex;flex-direction:column;margin-top:40px;\">\n        <div style=\"display:flex;align-items:baseline;gap:28px;padding:32px 0;border-top:1px solid oklch(0.88 0.005 260);border-bottom:1px solid #C9A227;transition:background 0.25s, padding-left 0.25s;\" style-hover=\"background:oklch(0.97 0.005 260);padding-left:16px;\">\n          <div style=\"font-size:15px;font-weight:800;color:#C9A227;letter-spacing:0.06em;width:36px;flex-shrink:0;\">01<\u002Fdiv>\n          <h3 style=\"font-size:24px;font-weight:800;margin:0;color:#0B3D91;width:200px;flex-shrink:0;\">Media<\u002Fh3>\n          <p style=\"font-size:15px;line-height:1.65;color:oklch(0.4 0.01 260);margin:0;max-width:560px;\">We create platforms, content, and media businesses that connect people, ideas, and communities.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:28px;padding:32px 0;border-bottom:1px solid oklch(0.88 0.005 260);transition:background 0.25s, padding-left 0.25s;\" style-hover=\"background:oklch(0.97 0.005 260);padding-left:16px;\">\n          <div style=\"font-size:15px;font-weight:800;color:#C9A227;letter-spacing:0.06em;width:36px;flex-shrink:0;\">02<\u002Fdiv>\n          <h3 style=\"font-size:24px;font-weight:800;margin:0;color:#0B3D91;width:200px;flex-shrink:0;\">Technology<\u002Fh3>\n          <p style=\"font-size:15px;line-height:1.65;color:oklch(0.4 0.01 260);margin:0;max-width:560px;\">We build technology-driven products and platforms that simplify, connect, and transform the way people live and work.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:28px;padding:32px 0;border-bottom:1px solid oklch(0.88 0.005 260);transition:background 0.25s, padding-left 0.25s;\" style-hover=\"background:oklch(0.97 0.005 260);padding-left:16px;\">\n          <div style=\"font-size:15px;font-weight:800;color:#C9A227;letter-spacing:0.06em;width:36px;flex-shrink:0;\">03<\u002Fdiv>\n          <h3 style=\"font-size:24px;font-weight:800;margin:0;color:#0B3D91;width:200px;flex-shrink:0;\">Property<\u002Fh3>\n          <p style=\"font-size:15px;line-height:1.65;color:oklch(0.4 0.01 260);margin:0;max-width:560px;\">We develop places and property businesses designed around real needs, sustainable growth, and long-term value.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:28px;padding:32px 0;border-bottom:1px solid oklch(0.88 0.005 260);transition:background 0.25s, padding-left 0.25s;\" style-hover=\"background:oklch(0.97 0.005 260);padding-left:16px;\">\n          <div style=\"font-size:15px;font-weight:800;color:#C9A227;letter-spacing:0.06em;width:36px;flex-shrink:0;\">04<\u002Fdiv>\n          <h3 style=\"font-size:24px;font-weight:800;margin:0;color:#0B3D91;width:200px;flex-shrink:0;\">Trading<\u002Fh3>\n          <p style=\"font-size:15px;line-height:1.65;color:oklch(0.4 0.01 260);margin:0;max-width:560px;\">We connect markets, products, and opportunities through strategic sourcing, distribution, and commercial networks.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:96px 56px;\">\n    <div style=\"max-width:1400px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start;\">\n      <div>\n        <h2 style=\"font-size:clamp(28px,3vw,38px);letter-spacing:-0.01em;font-weight:800;margin:0 0 20px;color:oklch(0.18 0.01 260);text-wrap:balance;\">From Opportunity to Business<\u002Fh2>\n        <p style=\"font-size:16px;line-height:1.75;color:oklch(0.4 0.01 260);margin:0 0 16px;\">Great businesses begin with recognizing an opportunity before it becomes obvious.<\u002Fp>\n        <p style=\"font-size:16px;line-height:1.75;color:oklch(0.4 0.01 260);margin:0 0 16px;\">We bring together strategy, technology, capital, partnerships, and execution to turn ideas into real businesses.<\u002Fp>\n        <p style=\"font-size:16px;line-height:1.75;color:oklch(0.4 0.01 260);margin:0;\">From launching new products to developing established ventures, we take an active role in building what comes next.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:8px;\">\n        <span style=\"font-size:16px;font-weight:800;color:#0B3D91;\">Identify<\u002Fspan>\n        <span style=\"color:#C9A227;font-size:18px;\">→<\u002Fspan>\n        <span style=\"font-size:16px;font-weight:800;color:#0B3D91;\">Build<\u002Fspan>\n        <span style=\"color:#C9A227;font-size:18px;\">→<\u002Fspan>\n        <span style=\"font-size:16px;font-weight:800;color:#0B3D91;\">Scale<\u002Fspan>\n        <span style=\"color:#C9A227;font-size:18px;\">→<\u002Fspan>\n        <span style=\"font-size:16px;font-weight:800;color:#0B3D91;\">Grow<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:white;padding:96px 56px;border-top:1px solid oklch(0.9 0.005 260);border-bottom:1px solid oklch(0.9 0.005 260);\">\n    <div style=\"max-width:800px;margin:0 auto;text-align:center;\">\n      <div style=\"font-size:13px;font-weight:700;letter-spacing:0.14em;color:#0B3D91;margin-bottom:20px;\">TURNING OPPORTUNITY INTO VALUE<\u002Fdiv>\n      <h2 style=\"font-size:clamp(28px,3vw,38px);letter-spacing:-0.01em;font-weight:800;margin:0 0 24px;color:oklch(0.18 0.01 260);text-wrap:balance;\">We look beyond ideas to what they can become.<\u002Fh2>\n      <p style=\"font-size:16px;line-height:1.75;color:oklch(0.4 0.01 260);margin:0 0 20px;\">From identifying an opportunity to developing the product, building the business, and taking it to market, we stay close to the process of turning potential into reality.<\u002Fp>\n      <p style=\"font-size:16px;line-height:1.75;color:oklch(0.4 0.01 260);margin:0;\">Our focus is simple: build businesses that solve real needs, create lasting value, and have room to grow.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:96px 56px;\">\n    <div style=\"max-width:1400px;margin:0 auto;\">\n      <h2 style=\"font-size:clamp(28px,3vw,38px);letter-spacing:-0.01em;font-weight:800;margin:0 0 48px;color:oklch(0.18 0.01 260);\">Our Approach<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:32px;\">\n        <div>\n          <div style=\"width:24px;height:2px;background:#C9A227;margin-bottom:16px;\"><\u002Fdiv>\n          <h3 style=\"font-size:16px;font-weight:800;letter-spacing:0.04em;margin:0 0 10px;color:#0B3D91;\">THINK LONG TERM<\u002Fh3>\n          <p style=\"font-size:14.5px;line-height:1.65;color:oklch(0.45 0.01 260);margin:0;\">We build for sustainable value rather than short-term attention.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"width:24px;height:2px;background:#C9A227;margin-bottom:16px;\"><\u002Fdiv>\n          <h3 style=\"font-size:16px;font-weight:800;letter-spacing:0.04em;margin:0 0 10px;color:#0B3D91;\">BUILD WITH PURPOSE<\u002Fh3>\n          <p style=\"font-size:14.5px;line-height:1.65;color:oklch(0.45 0.01 260);margin:0;\">Every venture begins with a clear opportunity, a real market, and a reason to exist.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"width:24px;height:2px;background:#C9A227;margin-bottom:16px;\"><\u002Fdiv>\n          <h3 style=\"font-size:16px;font-weight:800;letter-spacing:0.04em;margin:0 0 10px;color:#0B3D91;\">CONNECT THE ECOSYSTEM<\u002Fh3>\n          <p style=\"font-size:14.5px;line-height:1.65;color:oklch(0.45 0.01 260);margin:0;\">We bring together people, businesses, technology, capital, and markets.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"width:24px;height:2px;background:#C9A227;margin-bottom:16px;\"><\u002Fdiv>\n          <h3 style=\"font-size:16px;font-weight:800;letter-spacing:0.04em;margin:0 0 10px;color:#0B3D91;\">MOVE WITH AGILITY<\u002Fh3>\n          <p style=\"font-size:14.5px;line-height:1.65;color:oklch(0.45 0.01 260);margin:0;\">We stay entrepreneurial, adapting quickly as markets and opportunities evolve.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:#0B3D91;color:white;padding:110px 56px;text-align:center;\">\n    <div style=\"max-width:720px;margin:0 auto;\">\n      <div style=\"font-size:13px;font-weight:700;letter-spacing:0.14em;color:#C9A227;margin-bottom:24px;\">OUR BUSINESS PHILOSOPHY<\u002Fdiv>\n      <h2 style=\"font-size:clamp(28px,3.4vw,40px);font-weight:800;line-height:1.3;margin:0 0 28px;text-wrap:balance;\">See the opportunity.<br>Build the business.<br>Create the value.<\u002Fh2>\n      <p style=\"font-size:16px;line-height:1.75;color:oklch(0.85 0.01 260);margin:0;\">We believe entrepreneurship is not only about starting companies. It is about creating systems, products, and businesses that make a difference.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:96px 56px;\">\n    <div style=\"max-width:800px;margin:0 auto;text-align:center;\">\n      <h2 style=\"font-size:clamp(28px,3vw,38px);letter-spacing:-0.01em;font-weight:800;margin:0 0 20px;color:oklch(0.18 0.01 260);\">Beyond Industries<\u002Fh2>\n      <p style=\"font-size:16px;line-height:1.75;color:oklch(0.4 0.01 260);margin:0 0 12px;\">Our portfolio continues to evolve as new opportunities emerge.<\u002Fp>\n      <p style=\"font-size:16px;line-height:1.75;color:oklch(0.4 0.01 260);margin:0 0 28px;\">We are interested in businesses with strong fundamentals, scalable potential, and the ability to create value over time.<\u002Fp>\n      <div style=\"font-size:17px;font-weight:700;color:#0B3D91;\">Media. Technology. Property. Trading. And whatever comes next.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"about\" style=\"background:white;padding:96px 56px;border-top:1px solid oklch(0.9 0.005 260);\">\n    <div style=\"max-width:1400px;margin:0 auto;\">\n      <div style=\"font-size:13px;font-weight:700;letter-spacing:0.14em;color:#0B3D91;margin-bottom:16px;\">ABOUT<\u002Fdiv>\n      <h2 style=\"font-size:clamp(30px,3.2vw,42px);letter-spacing:-0.01em;font-weight:800;margin:0 0 24px;color:oklch(0.18 0.01 260);max-width:640px;text-wrap:balance;\">We Build Businesses, Not Just Ideas.<\u002Fh2>\n      <p style=\"font-size:16px;line-height:1.75;color:oklch(0.4 0.01 260);max-width:680px;margin:0 0 16px;\">We are a business development company focused on creating and growing ventures across multiple sectors.<\u002Fp>\n      <p style=\"font-size:16px;line-height:1.75;color:oklch(0.4 0.01 260);max-width:680px;margin:0 0 16px;\">Our role goes beyond investment. We actively participate in concept development, product creation, business strategy, partnerships, and growth.<\u002Fp>\n      <p style=\"font-size:16px;line-height:1.75;color:oklch(0.4 0.01 260);max-width:680px;margin:0 0 56px;\">We look for opportunities where entrepreneurial thinking, technology, and commercial execution can create something significantly greater than the sum of its parts.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:48px;\">\n        <div style=\"border-top:2px solid #C9A227;padding-top:20px;\">\n          <h3 style=\"font-size:14px;font-weight:800;letter-spacing:0.1em;margin:0 0 12px;color:#0B3D91;\">OUR VISION<\u002Fh3>\n          <p style=\"font-size:15px;line-height:1.7;color:oklch(0.4 0.01 260);margin:0;\">To build a portfolio of businesses that shape markets, create opportunities, and deliver lasting value.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top:2px solid #C9A227;padding-top:20px;\">\n          <h3 style=\"font-size:14px;font-weight:800;letter-spacing:0.1em;margin:0 0 12px;color:#0B3D91;\">OUR MISSION<\u002Fh3>\n          <p style=\"font-size:15px;line-height:1.7;color:oklch(0.4 0.01 260);margin:0;\">To identify opportunities, develop innovative products and businesses, and connect them to the resources, people, and markets required to grow.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"businesses\" style=\"padding:96px 56px;\">\n    <div style=\"max-width:1400px;margin:0 auto;\">\n      <div style=\"font-size:13px;font-weight:700;letter-spacing:0.14em;color:#0B3D91;margin-bottom:16px;\">BUSINESSES<\u002Fdiv>\n      <h2 style=\"font-size:clamp(30px,3.2vw,42px);letter-spacing:-0.01em;font-weight:800;margin:0 0 20px;color:oklch(0.18 0.01 260);max-width:640px;text-wrap:balance;\">Businesses Built for the Future<\u002Fh2>\n      <p style=\"font-size:16px;line-height:1.75;color:oklch(0.4 0.01 260);max-width:680px;margin:0 0 48px;\">Our businesses reflect our belief that opportunity exists at the intersection of changing markets, technology, and human needs.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:28px;margin-bottom:36px;\">\n        <div style=\"border:1px solid oklch(0.9 0.005 260);border-radius:2px;padding:28px 24px;transition:transform 0.25s, border-color 0.25s, box-shadow 0.25s;\" style-hover=\"transform:translateY(-4px);border-color:#C9A227;box-shadow:0 8px 24px oklch(0 0 0 / 0.06);\">\n          <div style=\"width:36px;height:36px;border-radius:2px;background:#0B3D91;margin-bottom:18px;\"><\u002Fdiv>\n          <h3 style=\"font-size:17px;font-weight:700;margin:0 0 8px;color:oklch(0.18 0.01 260);\">Media<\u002Fh3>\n          <p style=\"font-size:14px;line-height:1.6;color:oklch(0.45 0.01 260);margin:0;\">Creating platforms and experiences that inform, engage, and connect.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border:1px solid oklch(0.9 0.005 260);border-radius:2px;padding:28px 24px;transition:transform 0.25s, border-color 0.25s, box-shadow 0.25s;\" style-hover=\"transform:translateY(-4px);border-color:#C9A227;box-shadow:0 8px 24px oklch(0 0 0 / 0.06);\">\n          <div style=\"width:36px;height:36px;border-radius:2px;background:#0B3D91;margin-bottom:18px;\"><\u002Fdiv>\n          <h3 style=\"font-size:17px;font-weight:700;margin:0 0 8px;color:oklch(0.18 0.01 260);\">Technology<\u002Fh3>\n          <p style=\"font-size:14px;line-height:1.6;color:oklch(0.45 0.01 260);margin:0;\">Developing digital products and technology-enabled businesses that solve real problems.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border:1px solid oklch(0.9 0.005 260);border-radius:2px;padding:28px 24px;transition:transform 0.25s, border-color 0.25s, box-shadow 0.25s;\" style-hover=\"transform:translateY(-4px);border-color:#C9A227;box-shadow:0 8px 24px oklch(0 0 0 / 0.06);\">\n          <div style=\"width:36px;height:36px;border-radius:2px;background:#0B3D91;margin-bottom:18px;\"><\u002Fdiv>\n          <h3 style=\"font-size:17px;font-weight:700;margin:0 0 8px;color:oklch(0.18 0.01 260);\">Property<\u002Fh3>\n          <p style=\"font-size:14px;line-height:1.6;color:oklch(0.45 0.01 260);margin:0;\">Creating developments and property businesses that deliver practical and lasting value.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border:1px solid oklch(0.9 0.005 260);border-radius:2px;padding:28px 24px;transition:transform 0.25s, border-color 0.25s, box-shadow 0.25s;\" style-hover=\"transform:translateY(-4px);border-color:#C9A227;box-shadow:0 8px 24px oklch(0 0 0 / 0.06);\">\n          <div style=\"width:36px;height:36px;border-radius:2px;background:#0B3D91;margin-bottom:18px;\"><\u002Fdiv>\n          <h3 style=\"font-size:17px;font-weight:700;margin:0 0 8px;color:oklch(0.18 0.01 260);\">Trading<\u002Fh3>\n          <p style=\"font-size:14px;line-height:1.6;color:oklch(0.45 0.01 260);margin:0;\">Building commercial networks that connect products, markets, and opportunities.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <a href=\"#ventures\" style=\"font-size:14px;font-weight:700;color:#0B3D91;\">Explore Our Businesses →<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"ventures\" style=\"background:white;padding:96px 56px;border-top:1px solid oklch(0.9 0.005 260);\">\n    <div style=\"max-width:1400px;margin:0 auto;\">\n      <div style=\"font-size:13px;font-weight:700;letter-spacing:0.14em;color:#0B3D91;margin-bottom:16px;\">VENTURES<\u002Fdiv>\n      <h2 style=\"font-size:clamp(30px,3.2vw,42px);letter-spacing:-0.01em;font-weight:800;margin:0 0 20px;color:oklch(0.18 0.01 260);max-width:640px;text-wrap:balance;\">From Ideas to Impact<\u002Fh2>\n      <p style=\"font-size:16px;line-height:1.75;color:oklch(0.4 0.01 260);max-width:680px;margin:0 0 16px;\">We develop businesses from the ground up.<\u002Fp>\n      <p style=\"font-size:16px;line-height:1.75;color:oklch(0.4 0.01 260);max-width:680px;margin:0 0 48px;\">Our venture-building process combines market insight with product development, technology, partnerships, and commercial execution.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:24px;\">\n        <div style=\"border-top:2px solid #C9A227;padding-top:18px;\">\n          <div style=\"font-size:13px;font-weight:800;color:#C9A227;margin-bottom:8px;\">01 — DISCOVER<\u002Fdiv>\n          <p style=\"font-size:14px;line-height:1.6;color:oklch(0.45 0.01 260);margin:0;\">We identify emerging needs, market gaps, and opportunities.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top:2px solid #C9A227;padding-top:18px;\">\n          <div style=\"font-size:13px;font-weight:800;color:#C9A227;margin-bottom:8px;\">02 — DEFINE<\u002Fdiv>\n          <p style=\"font-size:14px;line-height:1.6;color:oklch(0.45 0.01 260);margin:0;\">We turn opportunities into clear business models and propositions.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top:2px solid #C9A227;padding-top:18px;\">\n          <div style=\"font-size:13px;font-weight:800;color:#C9A227;margin-bottom:8px;\">03 — BUILD<\u002Fdiv>\n          <p style=\"font-size:14px;line-height:1.6;color:oklch(0.45 0.01 260);margin:0;\">We develop the product, platform, operation, and ecosystem.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top:2px solid #C9A227;padding-top:18px;\">\n          <div style=\"font-size:13px;font-weight:800;color:#C9A227;margin-bottom:8px;\">04 — SCALE<\u002Fdiv>\n          <p style=\"font-size:14px;line-height:1.6;color:oklch(0.45 0.01 260);margin:0;\">We connect the business with customers, partners, capital, and markets.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top:2px solid #C9A227;padding-top:18px;\">\n          <div style=\"font-size:13px;font-weight:800;color:#C9A227;margin-bottom:8px;\">05 — GROW<\u002Fdiv>\n          <p style=\"font-size:14px;line-height:1.6;color:oklch(0.45 0.01 260);margin:0;\">We continuously evolve the business to create sustainable long-term value.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"partnerships\" style=\"padding:110px 56px;text-align:center;\">\n    <div style=\"max-width:720px;margin:0 auto;\">\n      <div style=\"font-size:13px;font-weight:700;letter-spacing:0.14em;color:#0B3D91;margin-bottom:16px;\">PARTNERSHIPS<\u002Fdiv>\n      <h2 style=\"font-size:clamp(30px,3.2vw,42px);letter-spacing:-0.01em;font-weight:800;margin:0 0 20px;color:oklch(0.18 0.01 260);text-wrap:balance;\">The Right Ideas Grow Faster Together.<\u002Fh2>\n      <p style=\"font-size:16px;line-height:1.75;color:oklch(0.4 0.01 260);margin:0 0 12px;\">We believe meaningful businesses are built through strong partnerships.<\u002Fp>\n      <p style=\"font-size:16px;line-height:1.75;color:oklch(0.4 0.01 260);margin:0 0 40px;\">We work with entrepreneurs, investors, operators, technology companies, property owners, suppliers, and strategic partners to create new opportunities.<\u002Fp>\n      <p style=\"font-size:18px;font-weight:700;color:#0B3D91;margin:0 0 24px;\">Have an opportunity to explore? Let's build something together.<\u002Fp>\n      <a href=\"#contact\" style=\"background:#0B3D91;color:white;padding:14px 28px;border-radius:2px;font-weight:700;font-size:14px;border-bottom:2px solid #C9A227;\">Start a Conversation →<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer id=\"contact\" style=\"background:#0B3D91;color:white;padding:64px 56px;\">\n    <div style=\"max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:40px;\">\n      <div style=\"max-width:340px;\">\n        <div style=\"font-size:14px;font-weight:800;letter-spacing:0.04em;margin-bottom:10px;\">PT. PUSPAWARNA MARA KREASI<\u002Fdiv>\n        <p style=\"font-size:13.5px;line-height:1.7;color:oklch(0.85 0.01 260);margin:0 0 8px;\">Building businesses. Connecting opportunities. Creating lasting value.<\u002Fp>\n        <div style=\"font-size:12.5px;font-weight:700;letter-spacing:0.08em;color:#C9A227;\">MEDIA · TECHNOLOGY · PROPERTY · TRADING<\u002Fdiv>\n      <\u002Fdiv>\n      <nav style=\"display:flex;flex-direction:column;gap:10px;font-size:13.5px;\">\n        <a href=\"#about\" style=\"color:white;\">About<\u002Fa>\n        <a href=\"#businesses\" style=\"color:white;\">Businesses<\u002Fa>\n        <a href=\"#ventures\" style=\"color:white;\">Ventures<\u002Fa>\n        <a href=\"#partnerships\" style=\"color:white;\">Partnerships<\u002Fa>\n        <a href=\"#contact\" style=\"color:white;\">Contact<\u002Fa>\n      <\u002Fnav>\n      <div style=\"font-size:13.5px;color:oklch(0.85 0.01 260);line-height:1.7;\">\n        <div>Jl. Sultan Iskandar Muda No.7, Pd. Pinang,<br>Kebayoran Lama, Jakarta Selatan 12240<\u002Fdiv>\n        <div style=\"margin-top:10px;\">www.ptpmk.id<\u002Fdiv>\n        <div>contact@ptpmk.id<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:1400px;margin:40px auto 0;padding-top:24px;border-top:1px solid oklch(0.4 0.02 260);font-size:12.5px;color:oklch(0.7 0.01 260);\">\n      © 2026 PT. Puspawarna Mara Kreasi. All rights reserved.\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<script>\n(function(){\n  var HAMBURGER = '<line x1=\"3\" y1=\"6\" x2=\"21\" y2=\"6\"><\u002Fline><line x1=\"3\" y1=\"12\" x2=\"21\" y2=\"12\"><\u002Fline><line x1=\"3\" y1=\"18\" x2=\"21\" y2=\"18\"><\u002Fline>';\n  var CLOSE = '<line x1=\"5\" y1=\"5\" x2=\"19\" y2=\"19\"><\u002Fline><line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"><\u002Fline>';\n  function closeMenu(){\n    var menu = document.getElementById('ptpmk-nav-mobile');\n    var btn = document.getElementById('ptpmk-menu-btn');\n    var icon = document.getElementById('ptpmk-menu-icon');\n    if (menu) menu.style.display = 'none';\n    if (btn) btn.setAttribute('aria-expanded', 'false');\n    if (icon) icon.innerHTML = HAMBURGER;\n  }\n  function openMenu(){\n    var menu = document.getElementById('ptpmk-nav-mobile');\n    var btn = document.getElementById('ptpmk-menu-btn');\n    var icon = document.getElementById('ptpmk-menu-icon');\n    if (menu) menu.style.display = 'flex';\n    if (btn) btn.setAttribute('aria-expanded', 'true');\n    if (icon) icon.innerHTML = CLOSE;\n  }\n  // Delegated on document so it keeps working even if the header subtree\n  // gets cloned/replaced after this script first runs.\n  document.addEventListener('click', function(e){\n    var t = e.target;\n    if (!t || !t.closest) return;\n    if (t.closest('#ptpmk-menu-btn')) {\n
